<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/contact_us.css">
    <link href='https://fonts.googleapis.com/css?family=Varela Round' rel='stylesheet'>
    
</head>
<body>
    <nav>
        <div class="logo">
            <div class="logo-content">
                <a href="/index.html"><img src="/images/mindparklogo.png" alt="logo"></a>
                <p>MindPark</p>
            </div>
        </div>

        <ul class="sidebar">
            <li class="cross-button" onclick="hideSideBar()"><a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-x"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></a></li>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/pages/news.html">News</a></li>
            <li><a href="/pages/features.html">Features</a></li>
            <li><a href="/pages/resources.html">Resources</a></li>
            <li><a href="/pages/testimonials.html">Testimonials</a></li>
            <li><a href="/pages/contact_us.html">Contact Us</a></li>
        </ul>

        <ul class="nav-items">
            <li class="nav-item"><a href="/index.html">Home</a></li>
            <li class="nav-item"><a href="/pages/news.html">News</a></li>
            <li class="nav-item"><a href="/pages/features.html">Features</a></li>
            <li class="nav-item"><a href="/pages/resources.html">Resources</a></li>
            <li class="nav-item"><a href="/pages/testimonials.html">Testimonials</a></li>
            <li class="nav-item"><a href="/pages/contact_us.html" class="active">Contact Us</a></li>
        </ul>

        <div class="menu-button">
            <a href="#" onclick="showSideBar()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-menu"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></a>
        </div>
    </nav>

    <main>
        <div class="section left">
            <h1>Contact Us</h1>
            <div class="contact-info">
                <div class="contact-info-tiles">
                    <div class="tiles-content">
                        <div class="tiles-row">
                            <div class="tiles-left">
                                <img src="/images/email.svg">
                            </div>
                            <div class="tiles-right">
                                <h2>Email</h2>
                                <p>contact@mindpark.app</p>
                            </div>
                        </div>

                        <div class="tiles-row">
                            <div class="tiles-left">
                                <img src="/images/phone.svg">
                            </div>
                            <div class="tiles-right">
                                <h2>Phone</h2>
                                <p>+977-9813831998</p>
                            </div>
                        </div>

                        <div class="tiles-row">
                            <div class="tiles-left">
                                <img src="/images/location.svg">
                            </div>
                            <div class="tiles-right">
                                <h2>Location</h2>
                                <p>Bhaisepati, Lalitpur, Nepal</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            
        </div>

        <div class="section right">
            <h1>Let's Talk</h1>
            <div class="contact-form">
                <div class="full-name">
                    <label for="full-name">Full name</label>
                    <input type="text" name="full-name" placeholder="Enter full name">
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Enter email address">
                </div>
                <div class="phone">
                    <label for="phone-number">Phone number</label>
                    <input type="number" name="phone-number" placeholder="Enter phone number">
                </div>
                <div class="message-box">
                    <label for="message">Message</label>
                    <textarea id="text-area" rows="10" cols="33" name="message" placeholder="Enter your message here" class="message"></textarea>
                </div>

                <div class="submit-btn">
                    <button>Submit</button>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/script.js"></script>
</body>
</html>
