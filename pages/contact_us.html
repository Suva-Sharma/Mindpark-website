        </div>

    <main>

        <form action="https://api.web3forms.com/submit" method="POST" class="form">
            <h1>Get in touch with us</h1>
            <div class="contact-form">
                <input type="hidden" name="access_key" value="68d468b1-7cce-453f-8e28-e3e688f0ad69">
                <div class="full-name">
                    <label for="fullName">Full name</label>
                    <input type="text" name="fullName" placeholder="Enter full name" onchange="handleInput(event)">
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Enter email address" onchange="handleInput(event)">
                </div>
                <div class="phone">
                    <label for="phoneNumber">Phone number</label>
                    <input type="number" name="phoneNumber" placeholder="Enter phone number" onchange="handleInput(event)">
                </div>
                <div class="message-box">
                    <label for="message">Message</label>
                    <textarea id="text-area" rows="10" cols="33" name="message" placeholder="Enter your message here" class="message" onchange="handleInput(event)"></textarea>
                </div>

                <div class="submit-btn">
                    <button type="submit">Submit</button>
                </div>
            </div>
        </form>
    </main>

    <script src="/js/script.js"></script>
</body>
