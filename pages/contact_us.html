        </div>

    <main class="flex flex-row">

        <form action="https://api.web3forms.com/submit" method="POST" class="form flex flex-col items-center w-full">
            <h1>Get in touch with us</h1>
            <div class="contact-form w-half flex flex-col justify-center">
                <input type="hidden" name="access_key" value="04a2b8d7-bbb3-425a-8621-6017260de4db">
                <div class="full-name">
                    <label for="fullName">Full name</label>
                    <input type="text" name="fullName" placeholder="Enter full name" onchange="handleInput(event)">
                </div>
                <div class="email">
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="Enter email address" onchange="handleInput(event)">
                </div>
                <div class="phone">
                    <label for="phoneNumber">Phone number</label>
                    <input type="text" name="phoneNumber" placeholder="Enter phone number" onchange="handleInput(event)">
                </div>
                <div class="message-box">
                    <label for="message">Message</label>
                    <textarea id="text-area" rows="10" cols="33" name="message" placeholder="Enter your message here" class="message" onchange="handleInput(event)"></textarea>
                </div>

                <div class="submit-btn flex justify-center items-center">
                    <button type="submit">Submit</button>
                </div>
            </div>
        </form>
    </main>

    <footer class="flex justify-center">
        © Copyright, 2024, BrainCast Technologies
    </footer>

    <script src="/js/script.js"></script>
